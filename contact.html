<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聯絡我們 | 壓力山大空間設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<header id="site-header"></header>
<div class="page-head"><div class="wrap"><div class="crumb"><a href="index.html">首頁</a> ／ 聯絡我們</div><h1>聯絡我們</h1></div></div>
<main class="wrap contact">
  <div>
    <div class="eyebrow">Contact</div>
    <h2>聊聊你的案子</h2>
    <dl class="spec"><dt>電話</dt><dd>02-2000-0000</dd><dt>信箱</dt><dd>hello@alexander.example</dd><dt>地址</dt><dd>台北市某區示範路 1 號 1 樓（虛構）</dd><dt>時間</dt><dd>週一至週五 10:00–19:00</dd></dl>
  </div>
  <form id="f">
    <label for="n">姓名<input id="n" required></label>
    <label for="m">聯絡信箱<input id="m" type="email" required></label>
    <label for="t">案件類型<select id="t"><option>接待中心</option><option>樣品屋</option><option>公設會所</option><option>其他</option></select></label>
    <label for="c">需求說明<textarea id="c"></textarea></label>
    <button class="send">送出</button>
    <p class="ok" id="ok" hidden>已收到（示範用，表單不會真的寄出）。</p>
  </form>
</main>
<footer id="site-footer"></footer>
<script src="assets/main.js?v=2"></script>
<script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('ok').hidden=false;});</script>
</body>
</html>
