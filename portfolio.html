<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品項目 | 壓力山大空間設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="page-head"><div class="wrap"><div class="crumb"><a href="index.html">首頁</a> ／ 作品項目</div><h1 id="ttl">作品項目</h1></div></div>
<main class="wrap"><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<footer id="site-footer"></footer>
<script src="assets/main.js"></script>
<script>
const fbox=document.getElementById('filters'), grid=document.getElementById('grid');
let cur=new URLSearchParams(location.search).get('cat'); if(!CATS[cur]) cur='all';
function render(){
  fbox.innerHTML=[['all','全部'],...Object.entries(CATS).map(([k,c])=>[k,c.zh])].map(([k,t])=>`<button data-k="${k}" aria-pressed="${k===cur}">${t}</button>`).join('');
  document.getElementById('ttl').textContent = cur==='all' ? '作品項目' : CATS[cur].zh;
  const list = PROJECTS.filter(p => cur==='all' || p.cat===cur);
  grid.innerHTML = list.map(p=>`<a class="card" href="project.html?id=${p.id}"><div class="img" style="${swatch(p)}"></div><h3>${p.title}</h3><div class="meta"><span>${CATS[p.cat].zh}</span><span>${p.city} · ${p.year}</span></div></a>`).join('');
}
fbox.addEventListener('click',e=>{const k=e.target.dataset.k;if(!k)return;cur=k;history.replaceState(null,'',k==='all'?'portfolio.html':'portfolio.html?cat='+k);render();});
render();
</script>
</body>
</html>
