<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>澄岩空間設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="hero" id="top" aria-roledescription="輪播">
  <div class="slide s1 on"><div class="scene"></div></div>
  <div class="slide s2"><div class="scene"></div></div>
  <div class="slide s3"><div class="scene"></div></div>
  <div class="hero-text wrap">
    <h1>澄 岩 空 間 設 計</h1>
    <p>STONELINE INTERIOR DESIGN</p>
    <div class="cap" id="cap">01 ／ 接待中心 · 石材與光的序列</div>
  </div>
  <div class="dots" id="dots">
    <button class="on" aria-label="第 1 張"></button>
    <button aria-label="第 2 張"></button>
    <button aria-label="第 3 張"></button>
  </div>
</div>

<section id="about">
  <div class="wrap about">
    <div>
      <div class="eyebrow">About</div>
      <h2>關於澄岩</h2>
      <p class="lead">我們相信空間應該先被感受，再被看見。</p>
      <p>澄岩專注於房地產空間設計：接待中心、樣品屋與公設會所。從建築量體、材質到動線，讓第一次走進來的人，就能想像住在這裡的日子。</p>
      <p>團隊由建築、室內與景觀背景的設計師組成，習慣在圖面之外，親自到現場確認每一道光線落下的位置。</p>
      <a class="more" href="about.html">MORE</a>
    </div>
    <div class="collage" aria-hidden="true">
      <div class="ph a"><span>樣品屋 · 客廳</span></div>
      <div class="ph b"><span>會所 · 吧台</span></div>
      <div class="ph c"><span>接待中心 · 廊道</span></div>
    </div>
  </div>
</section>

<section id="works" style="padding-top:0">
  <div class="wrap">
    <div class="eyebrow">Projects</div>
    <h2>作品項目</h2>
    <div class="cats" id="cats"></div>
  </div>
</section>
<section class="facts" id="facts">
  <div class="wrap">
    <div class="eyebrow">Facts</div>
    <h2>一些數字</h2>
    <div class="fact-row">
      <div class="fact"><div class="num" data-to="46">46</div><div class="lbl">服務客戶</div></div>
      <div class="fact"><div class="num" data-to="63">63</div><div class="lbl">完成作品</div></div>
      <div class="fact"><div class="num" data-to="9">9</div><div class="lbl">榮獲獎項</div></div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="assets/main.js"></script>
<script>
document.getElementById('cats').innerHTML = Object.entries(CATS).map(([k,c]) => {
  const list = PROJECTS.filter(p => p.cat === k);
  return `<a class="cat" href="portfolio.html?cat=${k}"><div class="thumb" style="${list[0] ? swatch(list[0]) : ''}"></div><div><h3>${c.zh}</h3><small>${c.en}</small></div><div class="n">${list.length} 件作品</div></a>`;
}).join('');
const slides=[...document.querySelectorAll('.slide')], dots=[...document.querySelectorAll('#dots button')];
const caps=['01 ／ 接待中心 · 石材與光的序列','02 ／ 公設會所 · 夜晚的弧形吧台','03 ／ 樣品屋 · 拱門與鼠尾草綠'];
const cap=document.getElementById('cap'); let i=0,timer;
function go(n){slides[i].classList.remove('on');dots[i].classList.remove('on');i=(n+slides.length)%slides.length;slides[i].classList.add('on');void dots[i].offsetWidth;dots[i].classList.add('on');cap.textContent=caps[i];clearTimeout(timer);if(!reduce)timer=setTimeout(()=>go(i+1),5500);}
dots.forEach((d,k)=>d.addEventListener('click',()=>go(k)));
if(!reduce) timer=setTimeout(()=>go(1),5500);
if(!reduce && 'IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,to=+el.dataset.to,t0=performance.now();(function tick(t){const p=Math.min(1,(t-t0)/1400);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);})(t0);}),{threshold:.6});
  document.querySelectorAll('.num').forEach(n=>io.observe(n));
}
</script>
</body>
</html>
